<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Scanner</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header id="app-header" class="app-header">
        <h1>Scanner</h1>
        <button id="reset-button" class="text-button" type="button" hidden>Reset</button>
      </header>

      <section id="welcome-screen" class="welcome-screen">
        <div>
          <h2>BetterScanner</h2>
          <p>Allow camera access to scan documents.</p>
        </div>
        <button id="start-button" class="primary-button" type="button">Open camera</button>
        <p class="helper-text">US Legal, 200 DPI. Your scans stay on this phone.</p>
        <p id="secure-context-note" class="helper-text" hidden>Camera access requires HTTPS.</p>
      </section>

      <section id="scanner-screen" class="scanner-screen" hidden>
        <div class="camera-frame">
          <video id="camera" autoplay playsinline muted aria-label="Camera preview"></video>
          <canvas id="outline-canvas" aria-hidden="true"></canvas>
          <div id="camera-status" class="camera-status">Opening camera...</div>
          <div class="camera-topbar">
            <span id="document-count" class="document-count">Document 1</span>
            <button id="menu-button" class="menu-button" type="button" aria-label="Open scan menu" aria-expanded="false">
              <span></span><span></span><span></span>
            </button>
          </div>
          <div id="capture-flash" class="capture-flash" aria-hidden="true"></div>
        </div>

        <div class="camera-actions">
          <button id="redo-button" class="camera-action-button camera-action-undo" type="button" disabled>Undo</button>
          <button id="manual-capture-button" class="capture-button" type="button" aria-label="Capture page">
            <span></span>
          </button>
          <button id="new-document-button" class="camera-action-button camera-action-new" type="button" disabled>New document</button>
        </div>

        <aside id="scanner-menu" class="scanner-menu" hidden aria-label="Scan options">
          <div class="menu-sheet">
            <div class="menu-heading">
              <div>
                <h2>Scans</h2>
                <p id="page-count">0 pages total</p>
              </div>
              <button id="close-menu-button" class="menu-close-button" type="button" aria-label="Close scan menu">Close</button>
            </div>

            <div id="menu-documents" class="menu-documents"></div>

            <label class="scan-mode-control" for="scan-mode-select">
              Scan mode
              <select id="scan-mode-select">
                <option value="black-and-white" selected>Text (B&W)</option>
                <option value="grayscale">Grayscale</option>
                <option value="color">Color</option>
              </select>
            </label>

            <div class="menu-utilities">
              <button id="flash-button" class="utility-button" type="button" disabled>Flash</button>
              <button id="switch-camera-button" class="utility-button" type="button">Flip camera</button>
            </div>

            <button id="finish-button" class="primary-button" type="button" disabled>Finish scans</button>
          </div>
        </aside>
        <input id="page-size-select" type="hidden" value="legal" />
      </section>

      <section id="results-screen" class="results-screen" hidden>
        <div class="results-heading">
          <h2 id="results-title">Your PDFs are ready</h2>
          <p>Save every document in one ZIP file, or save PDFs separately below.</p>
        </div>
        <button id="download-zip-button" class="primary-button full-width" type="button">Download all (.zip)</button>
        <div id="results-list" class="results-list"></div>
        <button id="scan-more-button" class="text-button full-width" type="button">Scan another stack</button>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script async src="https://docs.opencv.org/4.x/opencv.js"></script>
    <script src="app.js"></script>
  </body>
</html>
